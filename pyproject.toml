[project]
name = "garmin-sync"
version = "0.1.0"
description = "Garmin Connect data sync and analysis tool with LLM-friendly reports"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "James Della"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/jdellag/garmin-sync"
Repository = "https://github.com/jdellag/garmin-sync"
Issues = "https://github.com/jdellag/garmin-sync/issues"
dependencies = [
    "garminconnect>=0.3.0",
    "curl_cffi>=0.5.0",
    "typer[all]>=0.9.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
    "fitdecode>=0.10.0",
    "openai>=1.0.0",
    "tomli-w>=1.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "mcp[cli]>=1.0.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.1.0",
]

[project.scripts]
garmin-sync = "garmin_sync.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
